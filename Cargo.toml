[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
anyhow = "=1.0.100"
argon2 = "=0.5.3"
chrono = { version = "=0.4.41", features = ["serde"] }
axum = { version = "=0.8.4", features = ["http1", "json", "multipart", "tokio", "ws"] }
getrandom = "=0.3.3"
lru = "=0.16.0"
rcgen = { version = "=0.13.2", features = ["pem", "x509-parser"] }
tokio-tungstenite = { version = "=0.28.0", features = ["rustls-tls-webpki-roots"] }
rust-embed = { version = "=8.7.2", features = ["debug-embed"] }
redis = { version = "=0.32.7", features = ["connection-manager", "tokio-comp", "tokio-rustls-comp", "tls-rustls-webpki-roots"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.143"
sha2 = "=0.10.9"
hkdf = "=0.12.4"
chacha20poly1305 = "=0.10.1"
socket2 = { version = "=0.6.0", features = ["all"] }
sqlx = { version = "=0.8.6", default-features = false, features = ["chrono", "json", "macros", "migrate", "postgres", "runtime-tokio-rustls", "tls-rustls-aws-lc-rs", "uuid"] }
thiserror = "=2.0.16"
tokio = { version = "=1.47.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "=0.9.5"
time = { version = "=0.3.36", features = ["macros"] }
tower-http = { version = "=0.6.6", features = ["limit", "trace"] }
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.20", features = ["env-filter", "fmt", "json"] }
uuid = { version = "=1.18.1", features = ["serde", "v4"] }
libc = "=0.2.175"
tz-common = { path = "crates/tz-common" }
tz-net = { path = "crates/tz-net" }
tz-proto = { path = "crates/tz-proto" }
dashmap = "=6.1.0"
futures-util = "=0.3.31"
arc-swap = "=1.7.1"
log = "=0.4.28"
url = "=2.5.7"
async-trait = "=0.1.88"
bytes = "=1.10.1"
inventory = "=0.3.19"
rmp-serde = "=1.3.0"
rustls = { version = "=0.23.45", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
tokio-rustls = "=0.26.2"
rustls-pemfile = "=2.2.0"
hyper = { version = "=1.6.0", features = ["server", "client", "http1"] }
hyper-util = { version = "=0.1.14", features = ["tokio", "server-auto", "http1"] }
http-body-util = "=0.1.3"
http = "=1.3.1"
quinn = { version = "=0.11.8", default-features = false, features = ["runtime-tokio"] }
quinn-proto = "=0.11.19"
seahash = "=4.1.0"
metrics = "=0.24.2"
metrics-exporter-prometheus = "=0.17.2"
ipnet = "=2.11.0"
webpki-roots = "=1.0.3"
tz-pki = { path = "crates/tz-pki" }
tz-carrier = { path = "crates/tz-carrier" }
tz-guard = { path = "crates/tz-guard" }
tz-ingress = { path = "crates/tz-ingress" }
tz-agent = { path = "crates/tz-agent" }
sysinfo = "=0.33.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
await_holding_lock = "deny"
large_futures = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
