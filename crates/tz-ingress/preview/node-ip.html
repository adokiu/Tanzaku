<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>内网穿透节点</title>
<style>
  :root {
    --ink: #1a1814;
    --muted: #5c564c;
    --line: #ddd6c8;
    --paper: #f4f0e8;
    --card: #fbf9f5;
    --seal: #8f2d2a;
    --seal-soft: #f3e4e1;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    color: var(--ink);
    background:
      radial-gradient(1200px 480px at 50% -120px, #fff 0%, transparent 60%),
      var(--paper);
    font-family: "Songti SC", "Noto Serif SC", "Source Han Serif SC", "STSong", "SimSun", serif;
    display: flex;
    align-items: safe center;
    justify-content: center;
    padding: 32px 16px;
  }
  .wrap { width: min(760px, 100%); }
  .mark {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    font-size: 12px;
    letter-spacing: 0.22em;
    color: var(--muted);
  }
  .sheet {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 4px;
    box-shadow: 0 1px 0 rgba(255,255,255,.8) inset, 0 24px 48px rgba(60, 48, 30, .06);
    padding: 48px 52px 40px;
    position: relative;
    overflow: hidden;
  }
  .sheet::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 4px;
    background: var(--seal);
  }
  .seal { width: 92px; height: 92px; margin-bottom: 22px; }
  h1 {
    margin: 0 0 12px;
    font-size: 40px;
    font-weight: 600;
    letter-spacing: 0.04em;
    line-height: 1.2;
  }
  .lede {
    margin: 0;
    font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    font-size: 16px;
    line-height: 1.75;
    color: var(--muted);
  }
  dl {
    margin: 28px 0 0;
    display: grid;
    gap: 16px;
  }
  div.row {
    display: grid;
    grid-template-columns: 88px 1fr;
    gap: 12px;
    align-items: baseline;
    font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  }
  dt {
    margin: 0;
    font-size: 13px;
    letter-spacing: 0.12em;
    color: var(--muted);
  }
  dd {
    margin: 0;
    font-size: 18px;
    line-height: 1.5;
  }
  @media (max-width: 640px) {
    .sheet { padding: 32px 22px 28px; }
    h1 { font-size: 30px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark"><span>TANZAKU</span><span>节点说明</span></div>
    <article class="sheet">
      <svg class="seal" viewBox="0 0 92 92" aria-hidden="true">
        <circle cx="46" cy="46" r="42" fill="none" stroke="#8f2d2a" stroke-width="2"/>
        <circle cx="46" cy="46" r="36" fill="none" stroke="#8f2d2a" stroke-width="1"/>
        <text x="46" y="52" text-anchor="middle" fill="#8f2d2a" font-size="18" font-family="Songti SC, STSong, serif">节点</text>
      </svg>
      <h1>这是 Tanzaku 内网穿透节点</h1>
      <p class="lede">这个地址是节点本身。内网服务请通过已绑定的域名进入。</p>
      <dl>
        <div class="row"><dt>节点</dt><dd id="node-name">四川宜宾三线1</dd></div>
        <div class="row"><dt>访问 IP</dt><dd id="visitor-ip">正在查询</dd></div>
        <div class="row"><dt>位置</dt><dd id="visitor-geo">正在查询</dd></div>
      </dl>
    </article>
  </div>
  <script>
    const ipEl = document.getElementById('visitor-ip')
    const geoEl = document.getElementById('visitor-geo')
    fetch('https://api.ip.sb/geoip')
      .then((response) => response.json())
      .then((data) => {
        if (!data || !data.ip) throw new Error('empty')
        ipEl.textContent = data.ip
        const place = [data.country, data.region, data.city].filter(Boolean).join(' ')
        geoEl.textContent = [place, data.isp].filter(Boolean).join(' ') || '未知'
      })
      .catch(() => {
        ipEl.textContent = '暂时无法获取'
        geoEl.textContent = '暂时无法获取'
      })
  </script>
</body>
</html>
