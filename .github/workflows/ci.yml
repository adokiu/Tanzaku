name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  web:
    name: web (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [web-admin, web-user]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - name: Build
        working-directory: ${{ matrix.app }}
        run: |
          npm ci
          npm run build

  rust:
    name: rust (lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-admin/package-lock.json
      # board 通过 rust-embed 嵌入 web-admin/dist，编译前必须存在。
      - name: Build web-admin
        working-directory: web-admin
        run: |
          npm ci
          npm run build
      - name: Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        continue-on-error: true
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets
      - name: test
        run: cargo test --workspace

  agents:
    name: agents (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/setup-nasm@v1
        if: runner.os == 'Windows'
      - name: Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: check client / server
        run: cargo check -p tz-client -p tz-server
